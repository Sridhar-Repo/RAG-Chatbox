<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with your docs</title>
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #66707d;
      --line: #d9dee4;
      --accent: #0f6b6b;
      --accent-ink: #ffffff;
      --mark: #f6e27a;
      --user: #1c2430;
      --user-ink: #f4f6f8;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c;
        --panel: #1a212a;
        --ink: #e8ecf0;
        --muted: #8b95a1;
        --line: #2c3541;
        --accent: #4fb3b3;
        --accent-ink: #0c1216;
        --mark: #7a6a1c;
        --user: #2a3441;
        --user-ink: #e8ecf0;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-columns: 300px 1fr;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: auto;
    }

    aside h1 {
      font-family: var(--serif);
      font-size: 1.25rem;
      margin: 0;
      font-weight: 600;
    }

    aside p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.4;
    }

    #drop {
      border: 1.5px dashed var(--line);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      font-size: .9rem;
    }

    #drop.over,
    #drop:hover {
      border-color: var(--accent);
      color: var(--ink);
    }

    #docs {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #docs li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: .88rem;
    }

    #docs .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #docs .count {
      color: var(--muted);
      font-size: .78rem;
    }

    #docs button {
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
    }

    #docs button:hover {
      color: #c0392b;
    }

    #status {
      font-size: .85rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }

    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
    }

    .col {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-ink);
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      max-width: 85%;
      line-height: 1.45;
    }

    .msg.bot {
      font-family: var(--serif);
      font-size: 1.05rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .msg.bot .cite {
      font-family: var(--sans);
      font-size: .72rem;
      background: var(--mark);
      color: #1c2430;
      border-radius: 4px;
      padding: 1px 5px;
      cursor: pointer;
      border: 0;
      vertical-align: super;
    }

    .msg.bot.error {
      color: #c0392b;
      font-family: var(--sans);
      font-size: .95rem;
    }

    .sources {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--sans);
      margin-top: 10px;
    }

    .src {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: .84rem;
    }

    .src summary {
      cursor: pointer;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      list-style: none;
    }

    .src summary::-webkit-details-marker {
      display: none;
    }

    .src .n {
      background: var(--mark);
      color: #1c2430;
      border-radius: 4px;
      padding: 0 6px;
      font-weight: 600;
    }

    .src .where {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .src .score {
      color: var(--muted);
    }

    .src pre {
      margin: 0;
      padding: 0 10px 10px;
      white-space: pre-wrap;
      font-family: var(--sans);
      color: var(--muted);
      line-height: 1.5;
    }

    .src.flash {
      border-color: var(--accent);
    }

    .typing::after {
      content: "▍";
      animation: blink 1s steps(2) infinite;
      color: var(--accent);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing::after {
        animation: none;
      }
    }

    .empty {
      margin: auto;
      text-align: center;
      max-width: 420px;
      color: var(--muted);
    }

    .empty h2 {
      font-family: var(--serif);
      color: var(--ink);
      font-weight: 600;
      margin: 0 0 8px;
    }

    .empty button {
      margin-top: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }

    .empty button:hover {
      border-color: var(--accent);
    }

    form {
      padding: 14px 24px 22px;
    }

    .row {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      border: 0;
      background: none;
      resize: none;
      padding: 6px 8px;
      max-height: 140px;
    }

    textarea:focus-visible {
      outline: none;
    }

    .row:focus-within {
      border-color: var(--accent);
    }

    #send {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
    }

    #send:disabled {
      opacity: .5;
      cursor: default;
    }

    @media (max-width: 760px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 40vh;
      }

      main {
        height: auto;
        min-height: 60vh;
      }
    }
  </style>
</head>

<body>
  <aside>
    <h1>Chat with your docs</h1>
    <p>Add a few files, then ask questions. Answers come only from what you upload.</p>
    <div id="drop" tabindex="0" role="button">Drop PDF, TXT or MD here, or click to browse</div>
    <input id="file" type="file" accept=".pdf,.txt,.md" multiple hidden>
    <div id="status" aria-live="polite"></div>
    <ul id="docs"></ul>
  </aside>

  <main>
    <div id="thread">
      <div class="col" id="col"></div>
    </div>
    <form id="form">
      <div class="row">
        <textarea id="q" rows="1" placeholder="Ask about your documents…" maxlength="1000"></textarea>
        <button id="send" type="submit">Ask</button>
      </div>
    </form>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const col = $("#col"), thread = $("#thread"), q = $("#q"), send = $("#send"), statusEl = $("#status");
    let history = [], busy = false, docCount = 0;

    const esc = (s) => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

    async function loadDocs() {
      const docs = await (await fetch("/api/docs")).json();
      docCount = docs.length;
      $("#docs").innerHTML = docs.map(d =>
        `<li><span class="name" title="${esc(d.name)}">${esc(d.name)}</span><span class="count">${d.chunks} parts</span>
     <button aria-label="Remove ${esc(d.name)}" data-name="${esc(d.name)}">×</button></li>`).join("");
      if (!col.children.length) renderEmpty();
    }
    $("#docs").addEventListener("click", async (e) => {
      const name = e.target.dataset.name; if (!name) return;
      await fetch("/api/docs/" + encodeURIComponent(name), {method: "DELETE"});
      loadDocs();
    });
    async function upload(files) {
      for (const f of files) {
        statusEl.textContent = `Reading ${f.name}…`;
        const fd = new FormData(); fd.append("file", f);
        const r = await fetch("/api/upload", {method: "POST", body: fd});
        if (!r.ok) {statusEl.textContent = (await r.json()).detail || "Upload failed."; return;}
      }
      statusEl.textContent = "Ready. Ask away."; loadDocs();
    }
    const drop = $("#drop"), fileInput = $("#file");
    drop.onclick = () => fileInput.click();
    drop.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && fileInput.click();
    fileInput.onchange = () => upload([...fileInput.files]);
    drop.ondragover = (e) => {e.preventDefault(); drop.classList.add("over");};
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => {e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]);};

    function renderEmpty() {
      col.innerHTML = docCount
        ? `<div class="empty"><h2>What would you like to know?</h2><p>Ask in plain language. I'll show which passages I used.</p></div>`
        : `<div class="empty"><h2>Start by adding a document</h2><p>Drop a file on the left, then ask about it.</p></div>`;
    }
    function addMsg(cls, html) {
      if (col.querySelector(".empty")) col.innerHTML = "";
      const el = document.createElement("div"); el.className = "msg " + cls; el.innerHTML = html;
      col.appendChild(el); thread.scrollTop = thread.scrollHeight; return el;
    }
    function withCites(text, wrap) {
      return esc(text).replace(/\[(\d+)\]/g, (_, n) => `<button class="cite" data-n="${n}" type="button">${n}</button>`);
    }
    col.addEventListener("click", (e) => {
      const n = e.target.dataset.n; if (!n || !e.target.classList.contains("cite")) return;
      const wrap = e.target.closest(".turn"); const d = wrap && wrap.querySelector(`.src[data-n="${n}"]`);
      if (d) {d.open = true; d.classList.add("flash"); d.scrollIntoView({block: "nearest"}); setTimeout(() => d.classList.remove("flash"), 1200);}
    });

    async function ask(question) {
      busy = true; send.disabled = true;
      addMsg("user", esc(question));
      const turn = document.createElement("div"); turn.className = "turn";
      col.appendChild(turn);
      const bot = document.createElement("div"); bot.className = "msg bot typing"; turn.appendChild(bot);
      let text = "", srcBox = null;
      try {
        const r = await fetch("/api/chat", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question, history})
        });
        if (!r.ok) throw new Error((await r.json()).detail || "Something went wrong.");
        const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
        while (true) {
          const {value, done} = await reader.read(); if (done) break;
          buf += dec.decode(value, {stream: true});
          let i; while ((i = buf.indexOf("\n\n")) >= 0) {
            const line = buf.slice(0, i).replace(/^data: /, ""); buf = buf.slice(i + 2);
            const ev = JSON.parse(line);
            if (ev.type === "sources") {
              if (ev.data.length) {
                srcBox = document.createElement("div"); srcBox.className = "sources";
                srcBox.innerHTML = ev.data.map(s => `<details class="src" data-n="${s.n}"><summary><span class="n">${s.n}</span>
              <span class="where">${esc(s.source)}${s.page ? ", page " + s.page : ""}</span><span class="score">${Math.round(s.score * 100)}% match</span></summary>
              <pre>${esc(s.text)}</pre></details>`).join("");
              }
            } else if (ev.type === "token") {text += ev.data; bot.innerHTML = withCites(text);}
            else if (ev.type === "error") {bot.className = "msg bot error"; bot.textContent = ev.data;}
            thread.scrollTop = thread.scrollHeight;
          }
        }
        bot.classList.remove("typing");
        if (srcBox) turn.appendChild(srcBox);
        if (text) history.push({role: "user", content: question}, {role: "assistant", content: text});
      } catch (err) {
        bot.className = "msg bot error"; bot.textContent = err.message;
      }
      busy = false; send.disabled = false; q.focus(); thread.scrollTop = thread.scrollHeight;
    }

    $("#form").onsubmit = (e) => {e.preventDefault(); const v = q.value.trim(); if (!v || busy) return; q.value = ""; q.style.height = "auto"; ask(v);};
    q.onkeydown = (e) => {if (e.key === "Enter" && !e.shiftKey) {e.preventDefault(); $("#form").requestSubmit();} };
    q.oninput = () => {q.style.height = "auto"; q.style.height = q.scrollHeight + "px";};
    loadDocs();
  </script>
</body>

</html>
